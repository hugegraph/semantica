name: Finalize HugeGraph backend integration

on:
  push:
    branches:
      - feat/hugegraph-store-backend
    paths:
      - ".hugegraph-factory-fix/ready"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/hugegraph-store-backend
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply reviewed integration fixes
        run: python .hugegraph-factory-fix/finalize.py
      - name: Format and validate
        run: |
          python -m pip install black==25.1.0 isort==6.0.1
          black \
            semantica/graph_store/graph_store.py \
            semantica/graph_store/config.py \
            semantica/graph_store/__init__.py \
            semantica/graph_store/hugegraph \
            tests/graph_store/test_hugegraph_store.py
          isort \
            semantica/graph_store/graph_store.py \
            semantica/graph_store/config.py \
            semantica/graph_store/__init__.py \
            semantica/graph_store/hugegraph \
            tests/graph_store/test_hugegraph_store.py
          pip install -r .github/requirements/pep517-build.txt --require-hashes
          pip install --no-deps --no-build-isolation -e .
          pip install -r .github/requirements/base-deps.txt --require-hashes
          pip install -r .github/requirements/pytest-tool.txt --require-hashes
          python -m compileall -q semantica/graph_store tests/graph_store/test_hugegraph_store.py
          python -m pytest -q tests/graph_store/test_hugegraph_store.py
      - name: Commit finalized backend
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(graph-store): finalize HugeGraph backend integration"
          git push origin HEAD:feat/hugegraph-store-backend
